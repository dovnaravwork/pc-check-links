name: Companion verification

on:
  pull_request:
    paths:
      - "companion/**"
      - "global.json"
      - ".github/workflows/companion.yml"
  push:
    branches: [main]
    paths:
      - "companion/**"
      - "global.json"
      - ".github/workflows/companion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: "10.0.400"

      - name: Build core tests
        run: dotnet build companion/tests/PcCheck.Core.Tests/PcCheck.Core.Tests.csproj -m:1

      - name: Run core tests
        run: dotnet companion/tests/PcCheck.Core.Tests/bin/Debug/net10.0/PcCheck.Core.Tests.dll

      - name: Build app tests
        run: dotnet build companion/tests/PcCheck.App.Tests/PcCheck.App.Tests.csproj -m:1

      - name: Run app tests
        run: dotnet companion/tests/PcCheck.App.Tests/bin/Debug/net10.0/PcCheck.App.Tests.dll

      - name: Verify self-contained Windows build
        shell: pwsh
        run: >-
          dotnet publish companion/src/PcCheck.App/PcCheck.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -p:DebugSymbols=false
          -o companion/artifacts/win-x64

      - name: Verify executable and record ephemeral hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash companion/artifacts/win-x64/PC-Check.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "Ephemeral verification build SHA-256: $hash"
